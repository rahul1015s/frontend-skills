<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy anniversary</title>
<meta name="theme-color" content="#05050c">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
<style>
/* ───────── love-story engine (full-screen illustrated scenes driven by scroll) ───────── */
*,*::before,*::after{box-sizing:border-box}
html{background:#05050c;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{margin:0;color:#fff;font-family:'Playfair Display',Georgia,serif;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;overflow:hidden;--u:min(100vw,72svh);--gy:78%;background:#05050c}
.scene{position:absolute;inset:0;visibility:hidden;opacity:0;--gy:78%}
.cam{position:absolute;inset:0;transform-origin:50% 60%}
.sky{position:absolute;inset:0;background:linear-gradient(180deg,var(--c1) 0%,var(--c2) 55%,var(--c3) 100%)}
.prop{position:absolute;translate:-50% -50%;pointer-events:none}
.prop.b{translate:-50% -100%}
.inn{display:block;width:100%}.prop svg{display:block;width:100%;height:auto;overflow:visible}
.full{position:absolute;inset:0;pointer-events:none}
.layer-fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:12}
/* idle motion */
.bob{animation:bob 6s ease-in-out infinite}.float{animation:float 7s ease-in-out infinite}.sway{transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
.beat{animation:beat 1.25s ease-in-out infinite}.spin{animation:spin 40s linear infinite}
@keyframes bob{50%{transform:translateY(-1.6vmin)}}@keyframes float{50%{transform:translateY(-3vmin) rotate(2deg)}}@keyframes sway{50%{transform:rotate(2.6deg)}}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.14)}28%{transform:scale(1)}42%{transform:scale(1.1)}}@keyframes spin{to{transform:rotate(360deg)}}
.flame{animation:flick 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.flicker .glow{animation:glowp 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes flick{0%,100%{transform:scale(1)}40%{transform:scale(.88,1.14)}70%{transform:scale(1.06,.94)}}@keyframes glowp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.st{position:absolute;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.cl{position:absolute;animation:drift linear infinite}.cl svg{width:100%;height:auto;display:block}@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.win{animation:tw 4s ease-in-out infinite}
.fl{position:absolute;translate:-50% -100%;display:flex;flex-direction:column;align-items:center}
.fl .stem{display:block;width:.55vmin;min-width:3px;height:var(--sh);background:linear-gradient(#3fae68,#2a7f48);order:2;border-radius:3px}
.fl .bl{width:var(--b);order:1;margin-bottom:-1.4vmin;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}.fl .bl svg{display:block;width:100%;height:auto}
.hrt{position:absolute;bottom:-8vmin;height:auto;animation:rise linear infinite;opacity:.85}@keyframes rise{from{transform:translateY(0) rotate(-8deg)}to{transform:translateY(-120vh) rotate(10deg)}}
.ln{position:absolute;bottom:-10vmin;border-radius:34% 34% 42% 42%/20% 20% 55% 55%;background:radial-gradient(ellipse at 50% 70%,#ffe29a,#ff9f45 60%,#c4531a);box-shadow:0 0 4vmin #ffb703;animation:rise linear infinite;opacity:.9}
.bal{animation:float 6s ease-in-out infinite}.drip{animation:drip 3s linear infinite}@keyframes drip{from{transform:translateY(-6px);opacity:0}30%{opacity:.6}to{transform:translateY(46px);opacity:0}}
.steam{animation:steam 3s ease-in-out infinite}@keyframes steam{0%{opacity:0;transform:translateY(8px)}50%{opacity:.8}100%{opacity:0;transform:translateY(-8px)}}
.dot{animation:dotb 1s ease-in-out infinite}@keyframes dotb{50%{transform:translateY(-4px);opacity:.5}}
.ph{position:absolute;translate:-50% -50%;animation:bob 7s ease-in-out infinite;filter:drop-shadow(0 1.4vmin 2.4vmin rgba(0,0,0,.35))}.ph svg{display:block;width:100%;height:auto}
.word{position:absolute;left:50%;top:50%;translate:-50% -50%;font-family:'Caveat','Playfair Display',cursive;font-weight:700;white-space:nowrap;text-shadow:0 .6vmin 3vmin rgba(0,0,0,.35)}.word b{display:inline-block;font-weight:700}
/* captions */
.cap{position:absolute;left:0;right:0;z-index:20;text-align:center;padding:0 7vw;pointer-events:none;text-shadow:0 2px 26px rgba(0,0,0,.5)}
.cap[data-pos="top"]{top:10%}.cap[data-pos="mid"]{top:44%;translate:0 -50%}.cap[data-pos="bottom"]{bottom:11%}
.cap .line{font:italic 600 clamp(26px,6.6vw,66px)/1.16 'Playfair Display',Georgia,serif;letter-spacing:-.01em}
.cap .line .w{display:inline-block;margin:0 .13em}
.cap.dark{color:#4a1236;text-shadow:0 1px 18px rgba(255,255,255,.75)}
.cap .whisper{margin-top:.5em;font:400 clamp(22px,4.6vw,36px)/1.2 'Caveat',cursive;opacity:.92}
/* hud */
#bar{position:fixed;left:0;top:0;height:3px;width:100%;background:linear-gradient(90deg,#ff4d6d,#ffd166);transform-origin:0 50%;transform:scaleX(0);z-index:60}
#play{position:fixed;top:12px;right:12px;z-index:60;border:1px solid rgba(255,255,255,.35);background:rgba(10,10,20,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;border-radius:999px;padding:.55em 1em;font:600 13px/1 system-ui,sans-serif;letter-spacing:.04em;cursor:pointer;min-height:40px}
#hint{position:fixed;left:50%;bottom:3.2vh;translate:-50% 0;z-index:40;text-align:center;font:500 12px/1 system-ui,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#fff;opacity:.85;pointer-events:none}
#hint i{display:block;width:22px;height:34px;border:2px solid #fff;border-radius:14px;margin:0 auto 8px;position:relative}#hint i::after{content:"";position:absolute;left:50%;top:6px;width:4px;height:7px;margin-left:-2px;border-radius:2px;background:#fff;animation:wheel 1.6s ease-in-out infinite}@keyframes wheel{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(12px)}}
/* flower fill */
#bloom{position:absolute;inset:0;z-index:15;pointer-events:none;visibility:hidden}.bloom-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#ffc2d1,#ff8fab 70%,#ff6b8b)}
.bb{position:absolute;translate:-50% -50%;will-change:transform}.bb svg{display:block;width:100%;height:auto}
/* finale */
.ask{position:absolute;inset:0;z-index:30;display:grid;place-content:center;justify-items:center;gap:3.4vh;text-align:center;padding:0 7vw;pointer-events:none;visibility:hidden;opacity:0}
.ask.on{pointer-events:auto}
.ask[data-pos="high"]{place-content:start center;padding-top:17vh}.ask[data-pos="low"]{place-content:end center;padding-bottom:14vh}
.ask::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(closest-side at 50% 38%,rgba(0,0,0,.3),transparent 78%)}
.ask h2{margin:0;font:italic 700 clamp(32px,9vw,84px)/1.08 'Playfair Display',Georgia,serif;text-shadow:0 2px 30px rgba(0,0,0,.45);max-width:16ch}
.btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;position:relative;min-height:64px;width:min(92vw,520px)}
.btn{border:0;border-radius:999px;font:700 clamp(17px,4.4vw,24px)/1 system-ui,sans-serif;padding:1em 1.9em;cursor:pointer;min-height:54px;color:#fff;transition:transform .2s,box-shadow .2s}
.btn:active{transform:scale(.95)}
.yes{background:linear-gradient(135deg,#ff4d6d,#ff8fab);box-shadow:0 10px 44px rgba(255,77,109,.6);animation:beat 1.4s ease-in-out infinite}
.no{background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.4);transition:left .35s cubic-bezier(.23,1,.32,1),top .35s cubic-bezier(.23,1,.32,1),transform .2s}
.yesmsg{position:absolute;inset:0;z-index:40;display:grid;place-content:center;justify-items:center;gap:2.4vh;text-align:center;padding:0 8vw;visibility:hidden;opacity:0;pointer-events:none}
.yesmsg{isolation:isolate}.yesmsg::before{content:"";position:absolute;inset:8% 2%;z-index:-1;background:radial-gradient(ellipse at center,rgba(110,8,56,.82) 0%,rgba(110,8,56,.6) 50%,rgba(110,8,56,0) 74%);filter:blur(6px)}
.yesmsg.on{pointer-events:auto}
.yesmsg h3{margin:0;font:italic 700 clamp(34px,10vw,92px)/1.05 'Playfair Display',Georgia,serif;text-shadow:0 2px 30px rgba(120,10,50,.55)}
.yesmsg p{margin:0;font:400 clamp(24px,5.4vw,40px)/1.25 'Caveat',cursive;text-shadow:0 2px 20px rgba(120,10,50,.55);max-width:22ch}
.yesmsg a{background:#fff;color:#c2185b;text-decoration:none;font:700 clamp(16px,4vw,20px)/1 system-ui,sans-serif;padding:1em 1.6em;border-radius:999px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
#track{width:1px;pointer-events:none}
@media (prefers-reduced-motion:reduce){.bob,.float,.sway,.beat,.spin,.flame,.st,.cl,.hrt,.ln,.bal,.drip,.steam,.dot,.ph,.win{animation:none!important}}
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
/* ───────── figures: stylised people built from a skeleton (no faces; modern flat-illustration look) ───────── */
const Figures = (() => {
  const BASE = {
    h: [60, 34], n: [60, 52], sL: [46, 60], sR: [74, 60], eL: [40, 88], eR: [80, 88], wL: [40, 116], wR: [80, 116],
    pL: [53, 112], pR: [67, 112], kL: [52, 162], kR: [68, 162], fL: [50, 208], fR: [70, 208], tilt: 0
  };
  const J = (o) => Object.assign({}, BASE, o);
  /* single poses (frame 120 x 220) */
  const POSES = {
    stand: J({}),
    sad: J({ h: [58, 41], tilt: 9, n: [60, 55], sL: [47, 64], sR: [73, 64], eL: [44, 94], eR: [76, 94], wL: [70, 82], wR: [50, 82] }),
    happy: J({ h: [60, 32], tilt: -5, eL: [26, 40], wL: [14, 8], eR: [94, 40], wR: [106, 8] }),
    wave: J({ eR: [92, 70], wR: [100, 38] }),
    reach: J({ eR: [98, 66], wR: [128, 54], wL: [56, 92], eL: [44, 86] }),
    walk: J({ h: [62, 34], pL: [58, 112], pR: [62, 112], kL: [44, 160], kR: [76, 158], fL: [30, 204], fR: [88, 206], eL: [36, 88], wL: [28, 112], eR: [88, 86], wR: [96, 110] }),
    back: J({ h: [60, 36], tilt: 4, eL: [42, 90], wL: [44, 118], eR: [78, 90], wR: [76, 118] }),
    sit: J({ nodress: true, h: [68, 112], tilt: 14, n: [62, 128], sL: [58, 140], sR: [62, 138], eL: [80, 178], eR: [84, 176], wL: [92, 160], wR: [96, 158], pL: [40, 190], pR: [44, 190], kL: [86, 160], kR: [90, 158], fL: [92, 206], fR: [98, 206] }),
    sitfront: J({ nodress: true, h: [60, 74], n: [60, 92], sL: [46, 100], sR: [74, 100], eL: [40, 128], eR: [80, 128], wL: [54, 148], wR: [66, 148], pL: [53, 152], pR: [67, 152], kL: [42, 180], kR: [78, 180], fL: [40, 214], fR: [80, 214] }),
    phone: J({ h: [60, 38], tilt: 10, eL: [42, 92], wL: [52, 82], eR: [78, 92], wR: [68, 82] })
  };
  /* couple poses (frame 240 x 220): [A joints, B joints] with A on the left */
  const sh = (j, dx, dy = 0) => { const o = {}; for (const k in j) o[k] = Array.isArray(j[k]) ? [j[k][0] + dx, j[k][1] + dy] : j[k]; return o; };
  const COUPLES = {
    apart: [sh(POSES.back, 10), sh(POSES.back, 110)],
    holdhands: [sh(J({ eR: [92, 92], wR: [106, 114] }), 12), sh(J({ eL: [28, 92], wL: [14, 114] }), 112)],
    hug: [
      sh(J({ h: [62, 34], tilt: 8, n: [62, 52], sL: [48, 60], sR: [76, 60], eL: [44, 90], wL: [78, 98], eR: [96, 82], wR: [112, 96], pL: [55, 112], pR: [69, 112] }), 40),
      sh(J({ h: [58, 36], tilt: -8, n: [58, 54], sL: [44, 62], sR: [72, 62], eL: [30, 54], wL: [36, 80], eR: [60, 100], wR: [42, 92], pL: [51, 112], pR: [65, 112] }), 88)
    ],
    forehead: [
      sh(J({ h: [68, 36], tilt: 14, n: [62, 53], eL: [44, 90], wL: [74, 98], eR: [94, 74], wR: [112, 62] }), 36),
      sh(J({ h: [52, 38], tilt: -14, n: [58, 55], eL: [38, 66], wL: [58, 56], eR: [74, 96], wR: [48, 98] }), 100)
    ],
    dance: [
      sh(J({ h: [62, 32], tilt: 4, eL: [30, 70], wL: [28, 34], eR: [92, 90], wR: [114, 100], kL: [48, 160], kR: [72, 150], fL: [44, 206], fR: [84, 198] }), 30),
      sh(J({ h: [60, 38], tilt: -6, eL: [44, 80], wL: [30, 34], eR: [78, 92], wR: [50, 98], kL: [48, 156], kR: [74, 160], fL: [44, 204], fR: [92, 208] }), 108)
    ],
    kneel: [
      J({ h: [70, 70], tilt: 6, n: [72, 88], sL: [58, 96], sR: [86, 96], eL: [50, 124], wL: [58, 136], eR: [104, 104], wR: [126, 80], pL: [66, 142], pR: [80, 142], kL: [54, 190], kR: [112, 150], fL: [26, 210], fR: [114, 208] }),
      sh(J({ h: [60, 36], tilt: -6, eL: [44, 70], wL: [58, 48], eR: [76, 70], wR: [62, 48] }), 130)
    ],
    benchsolo: [null, sh(J({ nodress: true, h: [56, 76], tilt: -10, n: [60, 92], sL: [46, 100], sR: [74, 100], eL: [40, 128], eR: [80, 128], wL: [54, 148], wR: [66, 148], pL: [53, 152], pR: [67, 152], kL: [42, 180], kR: [78, 180], fL: [40, 214], fR: [80, 214] }), 70)],
    bench: [sh(J({ h: [60, 74], tilt: 6, n: [60, 92], sL: [46, 100], sR: [74, 100], eL: [40, 128], eR: [80, 128], wL: [54, 148], wR: [66, 148], pL: [53, 152], pR: [67, 152], kL: [42, 180], kR: [78, 180], fL: [40, 214], fR: [80, 214] }), 20),
      sh(J({ h: [56, 76], tilt: -12, n: [60, 92], sL: [46, 100], sR: [74, 100], eL: [40, 128], eR: [80, 128], wL: [54, 148], wR: [66, 148], pL: [53, 152], pR: [67, 152], kL: [42, 180], kR: [78, 180], fL: [40, 214], fR: [80, 214] }), 100)]
  };
  const line = (pts, w, c) => `<path d="M${pts.map(p => p.join(' ')).join(' L')}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
  const hairSvg = (style, [x, y], c) => {
    const back = {
      long: `<path d="M${x - 16} ${y - 2} C${x - 20} ${y - 24} ${x + 20} ${y - 24} ${x + 16} ${y - 2} C${x + 24} ${y + 22} ${x + 14} ${y + 40} ${x + 8} ${y + 42} L${x - 8} ${y + 42} C${x - 14} ${y + 40} ${x - 24} ${y + 22} ${x - 16} ${y - 2}Z" fill="${c}"/>`,
      short: '', curly: `<circle cx="${x}" cy="${y - 6}" r="20" fill="${c}"/>`, bun: `<circle cx="${x}" cy="${y - 20}" r="8" fill="${c}"/>`,
      pony: `<path d="M${x + 10} ${y - 6} C${x + 30} ${y - 4} ${x + 30} ${y + 24} ${x + 18} ${y + 36} C${x + 20} ${y + 18} ${x + 14} ${y + 6} ${x + 8} ${y + 2}Z" fill="${c}"/>`
    }[style] || '';
    const cap = style === 'curly' ? `<path d="M${x - 14} ${y - 2} C${x - 16} ${y - 18} ${x + 16} ${y - 18} ${x + 14} ${y - 2} C${x + 8} ${y - 8} ${x - 8} ${y - 8} ${x - 14} ${y - 2}Z" fill="${c}"/>` : `<path d="M${x - 15} ${y - 1} C${x - 17} ${y - 21} ${x + 17} ${y - 21} ${x + 15} ${y - 1} C${x + 9} ${y - 10} ${x - 5} ${y - 10} ${x - 15} ${y - 1}Z" fill="${c}"/>`;
    return { back, front: cap };
  };
  /* one person: o = { who:'he'|'she', skin, top, bottom, hair, hairStyle, shoe, dress, flip, sc } */
  const person = (j, o) => {
    const she = o.who === 'she', skin = o.skin || '#f2c4a0', top = o.top || (she ? '#ff6b8b' : '#3b5bdb'), bottom = o.bottom || (she ? '#7a3b69' : '#22304f');
    const hair = o.hair || (she ? '#2a1a1a' : '#1c1a22'), shoe = o.shoe || '#1a1a22', lw = she ? 10 : 12, aw = she ? 7 : 8.5;
    const mid = [(j.pL[0] + j.pR[0]) / 2, (j.pL[1] + j.pR[1]) / 2], ms = [(j.sL[0] + j.sR[0]) / 2, (j.sL[1] + j.sR[1]) / 2];
    const hs = hairSvg(o.hairStyle || (she ? 'long' : 'short'), j.h, hair);
    let s = '';
    s += line([j.sR, j.eR], aw, top) + line([j.eR, j.wR], aw - 1, skin) + `<circle cx="${j.wR[0]}" cy="${j.wR[1]}" r="${aw * 0.62}" fill="${skin}"/>`; // far arm
    const dress = she && o.dress !== false && !j.nodress;
    if (dress) { /* dress: legs show below the hem */
      s += line([j.kL, j.fL], lw - 1, skin) + line([j.kR, j.fR], lw - 1, skin);
      s += `<ellipse cx="${j.fL[0] - 2}" cy="${j.fL[1] + 3}" rx="8" ry="4.5" fill="${shoe}"/><ellipse cx="${j.fR[0] + 2}" cy="${j.fR[1] + 3}" rx="8" ry="4.5" fill="${shoe}"/>`;
    } else {
      s += line([j.pL, j.kL, j.fL], lw, bottom) + line([j.pR, j.kR, j.fR], lw, bottom);
      s += `<ellipse cx="${j.fL[0] - 2}" cy="${j.fL[1] + 3}" rx="9" ry="4.5" fill="${shoe}"/><ellipse cx="${j.fR[0] + 2}" cy="${j.fR[1] + 3}" rx="9" ry="4.5" fill="${shoe}"/>`;
    }
    s += hs.back;
    if (dress) {
      const k = [(j.kL[0] + j.kR[0]) / 2, Math.min(j.kL[1], j.kR[1])], flare = j.pL[1] > 140 ? 20 : 27;
      s += `<path d="M${j.sL[0]} ${j.sL[1]} L${j.sR[0]} ${j.sR[1]} C${mid[0] + 9} ${(ms[1] + mid[1]) / 2} ${mid[0] + 9} ${mid[1] - 8} ${mid[0] + 9} ${mid[1] - 4} C${k[0] + flare} ${mid[1] + 20} ${k[0] + flare + 2} ${k[1] - 6} ${k[0] + flare - 2} ${k[1] + 2} Q${k[0]} ${k[1] + 12} ${k[0] - flare + 2} ${k[1] + 2} C${k[0] - flare - 2} ${k[1] - 6} ${k[0] - flare} ${mid[1] + 20} ${mid[0] - 9} ${mid[1] - 4} C${mid[0] - 9} ${mid[1] - 8} ${mid[0] - 9} ${(ms[1] + mid[1]) / 2} ${j.sL[0]} ${j.sL[1]}Z" fill="${top}"/>`;
      s += `<path d="M${mid[0] - 10} ${mid[1] - 6} Q${mid[0]} ${mid[1] + 2} ${mid[0] + 10} ${mid[1] - 6}" stroke="${bottom}" stroke-width="3" fill="none" opacity=".55"/>`;
    } else {
      s += line([ms, mid], she ? 20 : 26, top) + line([j.sL, j.sR], she ? 12 : 13, top);
    }
    s += line([j.n, [j.h[0], j.h[1] + 12]], 8, skin);
    s += `<g transform="rotate(${j.tilt || 0} ${j.h[0]} ${j.h[1]})"><circle cx="${j.h[0]}" cy="${j.h[1]}" r="14.5" fill="${o.back ? hair : skin}"/>${o.back ? '' : hs.front}${o.beard && !o.back ? `<path d="M${j.h[0] - 12} ${j.h[1] + 2} C${j.h[0] - 12} ${j.h[1] + 18} ${j.h[0] + 12} ${j.h[1] + 18} ${j.h[0] + 12} ${j.h[1] + 2} C${j.h[0] + 6} ${j.h[1] + 8} ${j.h[0] - 6} ${j.h[1] + 8} ${j.h[0] - 12} ${j.h[1] + 2}Z" fill="${o.beard === true ? hair : o.beard}"/>` : ''}</g>`;
    s += line([j.sL, j.eL], aw, top) + line([j.eL, j.wL], aw - 1, skin) + `<circle cx="${j.wL[0]}" cy="${j.wL[1]}" r="${aw * 0.62}" fill="${skin}"/>`; // near arm
    return `<g>${s}</g>`;
  };
  const wrap = (inner, w, h) => `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" overflow="visible" aria-hidden="true">${inner}</svg>`;
  /* public: figure(pose, opts) -> { svg, w, h } ; pair(name, a, b) -> composite */
  const figure = (pose, o = {}) => {
    const j = POSES[pose] || POSES.stand; let g = person(j, o);
    if (o.flip) g = `<g transform="translate(120 0) scale(-1 1)">${g}</g>`;

/* ───────── particle effects on one canvas: rain, snow, petals, hearts, fireflies, sparkles, confetti ───────── */
const FX = (() => {
  let cv, ctx, W = 0, H = 0, dpr = 1, mode = 'none', next = 'none', parts = [], t0 = 0, max = 90, reduce = false, rnd = Math.random;

    else if (m === 'snow') { p.vy = .6 + rnd() * 1.2; p.vx = .2; p.s = 1.5 + rnd() * 3; p.a = .5 + rnd() * .5; }
    else if (m === 'petals' || m === 'rose') { p.vy = .8 + rnd() * 1.4; p.vx = -.4 + rnd() * .8; p.s = 5 + rnd() * 7; p.vr = (rnd() - .5) * .06; p.c = COL[m === 'rose' ? 'rose' : 'petals'][(rnd() * 4) | 0]; p.a = .85; }
    else if (m === 'hearts') { p.y = H + 20; p.vy = -(.7 + rnd() * 1.3); p.s = 6 + rnd() * 12; p.c = COL.hearts[(rnd() * 4) | 0]; p.a = .75; }
    else if (m === 'fireflies') { p.y = rnd() * H; p.vx = (rnd() - .5) * .5; p.vy = (rnd() - .5) * .5; p.s = 1.6 + rnd() * 2.4; p.c = '#fff3a8'; }
    else if (m === 'spark') { p.vx = burst.vx; p.vy = burst.vy; p.x = burst.x; p.y = burst.y; p.s = 2 + rnd() * 1.8; p.c = burst.c; p.a = 1; }
    else if (m === 'sparkle') { p.y = rnd() * H; p.s = 2 + rnd() * 4; p.life = rnd() * 6; p.c = '#fff'; }
    else if (m === 'confetti') { const a = rnd() * 6.28, v = burst ? 6 + rnd() * 14 : 0; p.x = burst ? W / 2 : rnd() * W; p.y = burst ? H * .55 : -20; p.vx = Math.cos(a) * v; p.vy = burst ? Math.sin(a) * v - 4 : 1 + rnd() * 2.5; p.s = 5 + rnd() * 8; p.vr = (rnd() - .5) * .3; p.c = COL.confetti[(rnd() * 6) | 0]; p.heart = rnd() > .55; p.burst = burst; }

  };

  const draw = (p) => {

    burst(n = 90) { for (let i = 0; i < n; i++) parts.push(spawn('confetti', true)); },
